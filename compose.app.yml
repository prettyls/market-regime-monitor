# Layer over docker-compose.yml; the database-only development flow still works.
services:
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://regime:regime@postgres:5432/regime?schema=public
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://regime:regime@postgres:5432/regime?schema=public
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
