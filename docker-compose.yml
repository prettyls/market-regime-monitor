services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regime
      POSTGRES_PASSWORD: regime
      POSTGRES_DB: regime
    ports:
      - "5432:5432"
    volumes:
      - regime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regime -d regime"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  regime-postgres:
