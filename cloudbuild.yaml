substitutions:
  _REGION: us-central1
  _REPOSITORY: market-regime-monitor
  _TAG: dev
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, runtime, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:${_TAG}', .]
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, migration, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/migration:${_TAG}', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/migration:${_TAG}'
